services:
  api:
    build: .
    container_name: llm_app_api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_app
    ports:
      - "5433:5432"
    volumes:
      - llm_app_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: llm_app_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  llm_app_postgres_data: